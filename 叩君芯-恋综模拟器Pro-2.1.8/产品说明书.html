<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>心动信号·暗涌 — 上手引导</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/chinese-simplified-400.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/chinese-simplified-500.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/chinese-simplified-600.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/chinese-simplified-700.min.css">
<style>
:root {
  --pink: #f472b6;
  --pink-dark: #be185d;
  --text: #1a1a1a;
  --text-muted: #64748b;
  --bg: #f0f4f8;
  --card: rgba(255, 255, 255, 0.92);
  --sidebar-w: 46px;
  --radius: 16px;
  --font: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
@media (max-width: 639px) {
  :root { --sidebar-w: 0px; }
}
@media (min-width: 640px) {
  :root { --sidebar-w: 112px; }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: linear-gradient(165deg, #fdf2f8 0%, var(--bg) 42%, #e0f2fe 100%);
  color: var(--text);
  line-height: 1.65;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

.wizard-shell { display: flex; width: 100%; height: 100dvh; height: 100vh; }

/* ---- 侧边栏：手机隐藏，正文全宽 ---- */
.wizard-sidebar {
  flex-shrink: 0;
  width: var(--sidebar-w);
  height: 100%;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid rgba(244, 114, 182, 0.12);
  display: flex;
  flex-direction: column;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 0 calc(8px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  overflow-x: hidden;
}
@media (max-width: 639px) {
  .wizard-sidebar { display: none; }
}
.sidebar-brand {
  padding: 6px 4px 10px;
  text-align: center;
  border-bottom: 1px solid rgba(244, 114, 182, 0.08);
  margin-bottom: 6px;
}
.sidebar-brand .brand-name,
.sidebar-brand .brand-game { display: none; }
@media (min-width: 640px) {
  .sidebar-brand .brand-name {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: var(--pink-dark);
    letter-spacing: 0.06em;
  }
  .sidebar-brand .brand-game {
    display: block;
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 2px;
  }
}
.sidebar-progress {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--pink), #fb7185);
  padding: 3px 7px;
  border-radius: 999px;
  line-height: 1.2;
}
.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 4px; }
.sidebar-item {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 6px 2px; border: none; background: transparent; border-radius: 10px;
  cursor: pointer; font-family: inherit; width: 100%;
}
.sidebar-item:active { background: rgba(244, 114, 182, 0.08); }
.sidebar-dot {
  width: 28px; height: 28px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: #94a3b8; background: #fff;
  border: 1.5px solid rgba(226, 232, 240, 0.95);
  transition: all 0.2s ease;
}
.sidebar-label {
  display: none;
  font-size: 9px; font-weight: 600; color: #94a3b8;
  text-align: center; line-height: 1.2; margin-top: 3px;
}
@media (min-width: 640px) {
  .sidebar-label { display: block; }
  .sidebar-item { gap: 2px; padding: 7px 4px; }
}
.sidebar-item.done .sidebar-dot {
  background: #ecfdf5; border-color: #6ee7b7; color: #047857;
}
.sidebar-item.active .sidebar-dot {
  background: linear-gradient(135deg, var(--pink), #fb7185);
  border-color: transparent; color: #fff;
  box-shadow: 0 3px 12px rgba(190, 24, 93, 0.28);
}
.sidebar-item.active .sidebar-label { color: var(--pink-dark); }

/* ---- 主区 ---- */
.wizard-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.wizard-header {
  flex-shrink: 0;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 12px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(244, 114, 182, 0.1);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.header-step-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  color: var(--pink-dark);
  background: rgba(252, 231, 243, 0.9);
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
@media (min-width: 640px) {
  .header-step-badge { display: none; }
}
.header-progress {
  flex: 1;
  height: 4px;
  background: rgba(244, 114, 182, 0.15);
  border-radius: 999px;
  overflow: hidden;
}
.header-top .header-progress { margin-bottom: 0; }
.header-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink), #fb7185);
  border-radius: 999px;
  transition: width 0.35s ease;
}
.wizard-header h1 {
  font-size: 18px; font-weight: 700; color: var(--pink-dark);
  line-height: 1.35;
}
.wizard-header p {
  font-size: 13px; color: var(--text-muted); margin-top: 4px;
}

/* 顶部板块导航 — 横向滚动，快速跳转 */
.top-nav-wrap {
  margin: 12px -18px 0;
  padding: 10px 0 0;
  border-top: 1px solid rgba(244, 114, 182, 0.1);
}
.top-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 0 18px 2px;
}
.top-nav::-webkit-scrollbar { display: none; }
.top-nav-chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid #e2e8f0;
  background: #fff;
  font-size: 12px;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  line-height: 1.2;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.top-nav-chip:active { transform: scale(0.97); }
.top-nav-chip.done {
  background: #f0fdf4;
  border-color: #bbf7d0;
  color: #047857;
}
.top-nav-chip.active {
  background: linear-gradient(135deg, var(--pink), #fb7185);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 10px rgba(190, 24, 93, 0.28);
}

.wizard-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 18px 20px;
}
.wizard-slide {
  animation: slide-in 0.3s ease;
  max-width: 520px;
  margin: 0 auto;
}
@keyframes slide-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.slide-card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.98);
  border-radius: var(--radius);
  padding: 20px 18px;
  box-shadow: 0 4px 24px rgba(190, 24, 93, 0.07);
}

/* Hero */
.hero-card { text-align: center; padding: 4px 0 0; }
.hero-badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  color: var(--pink-dark); background: rgba(244, 114, 182, 0.12);
  padding: 5px 16px; border-radius: 999px; letter-spacing: 0.05em; margin-bottom: 14px;
}
.hero-title {
  font-size: 22px; font-weight: 700; color: var(--pink-dark);
  letter-spacing: 0.03em; margin-bottom: 6px; line-height: 1.3;
}
.hero-sub { font-size: 14px; color: #475569; margin-bottom: 12px; }
.version-tag {
  display: inline-block; font-size: 12px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #64748b, #475569);
  padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;
}
.hero-desc {
  font-size: 14px; color: #334155; text-align: left; line-height: 1.7;
  padding: 14px 16px; background: #f8fafc;
  border-radius: 12px; border: 1px solid #e2e8f0;
}
.hero-desc strong { color: var(--pink-dark); font-weight: 600; }
.slide-cta {
  text-align: center; font-size: 14px; font-weight: 600; color: var(--pink-dark);
  margin-top: 16px; padding: 12px; background: rgba(252, 231, 243, 0.55); border-radius: 12px;
}

/* 文案层级 */
.action-lead {
  font-size: 16px; font-weight: 700; color: #0f172a;
  margin-bottom: 10px; line-height: 1.5;
}
.action-lead em { font-style: normal; color: var(--pink-dark); }
.action-sub {
  font-size: 14px; color: #475569; margin-bottom: 16px; line-height: 1.65;
}
.douyin-line {
  font-size: 14px; color: var(--pink-dark); font-weight: 600;
  margin-bottom: 14px; line-height: 1.5;
}
.finish-meta {
  margin-top: 14px; font-size: 13px; color: var(--text-muted);
}

/* 步骤列表 — 单列全宽 */
.action-steps { display: flex; flex-direction: column; gap: 10px; }
.action-step {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 14px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
}
.action-step-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--pink), #fb7185);
  color: #fff; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.action-step-body { flex: 1; min-width: 0; }
.action-step-title {
  font-size: 15px; font-weight: 700; color: #1e293b;
  margin-bottom: 4px; line-height: 1.4;
}
.action-step-desc {
  font-size: 14px; color: #64748b; line-height: 1.6;
}
.action-step-desc strong { color: var(--pink-dark); font-weight: 600; }
.action-step-desc code {
  font-size: 0.92em;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(244, 114, 182, 0.1);
  color: var(--pink-dark);
}

.slide-tip {
  font-size: 13px; color: var(--pink-dark);
  background: rgba(252, 231, 243, 0.8);
  border-left: 3px solid var(--pink);
  padding: 12px 14px; border-radius: 0 10px 10px 0;
  margin-top: 16px; line-height: 1.6;
}
.slide-foot {
  text-align: center; font-size: 13px; color: var(--text-muted);
  margin-top: 16px; padding-top: 4px;
}

/* 信息面板 — 单列堆叠，替代左右分栏 */
.info-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.info-panel {
  padding: 16px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
}
.info-panel-accent { border-left: 4px solid var(--pink); }
.info-panel-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.info-panel-icon { font-size: 20px; line-height: 1; }
.info-panel-head h4 {
  font-size: 15px; font-weight: 700; color: var(--pink-dark); line-height: 1.35;
}
.info-panel p {
  font-size: 14px; color: #475569; line-height: 1.65;
}
.info-panel p + p { margin-top: 8px; }
.info-panel-note {
  font-size: 13px; color: #64748b; margin-top: 10px;
  padding-top: 10px; border-top: 1px dashed #e2e8f0;
}

/* 浏览器推荐 — 单列 */
.pick-stack { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 16px; }
.pick-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
}
.pick-card-icon { font-size: 32px; line-height: 1; flex-shrink: 0; }
.pick-card-body { flex: 1; min-width: 0; }
.pick-card-name { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
.pick-card-tag { font-size: 13px; color: var(--pink-dark); font-weight: 500; }

/* 模型选项 — 单列卡片 */
.model-stack { display: flex; flex-direction: column; gap: 10px; }
.model-card {
  padding: 14px 16px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
}
.model-card.recommended {
  border-color: rgba(244, 114, 182, 0.45);
  background: linear-gradient(135deg, rgba(252,231,243,0.5), #fff);
}
.model-card.model-card-warn {
  border-color: rgba(245, 158, 11, 0.45);
  background: linear-gradient(135deg, rgba(254, 243, 199, 0.55), #fff);
}
.model-card.model-card-warn .model-card-desc { color: #b45309; font-weight: 500; }
.model-card-name {
  font-size: 14px; font-weight: 700; color: var(--pink-dark);
  margin-bottom: 4px; word-break: break-all;
}
.model-card-desc { font-size: 14px; color: #64748b; line-height: 1.55; }

/* 示意图 */
.illus {
  width: 100%; border-radius: 12px; overflow: hidden;
  border: 1px solid #e2e8f0; background: #fff;
  box-shadow: 0 2px 12px rgba(190, 24, 93, 0.05);
  margin: 14px 0 6px;
}
.illus-caption { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.illus-inner { padding: 14px; }

.illus-folder-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 12px; margin-bottom: 8px;
  font-size: 14px; line-height: 1.6;
}
.illus-folder-item:last-child { margin-bottom: 0; }
.illus-folder-item .folder-text { flex: 1; min-width: 0; }
.illus-folder-item .folder-hint {
  display: block; margin-top: 4px;
  font-size: 13px; font-weight: 600; opacity: 0.9;
}
.illus-folder-item.highlight {
  background: linear-gradient(135deg, rgba(252,231,243,0.95), #fff);
  border: 2px solid rgba(244, 114, 182, 0.45);
  font-weight: 700; color: var(--pink-dark);
}
.illus-folder-item.muted {
  color: var(--text-muted); background: #f8fafc; font-size: 13px;
}
.illus-folder-icon { font-size: 22px; flex-shrink: 0; line-height: 1.2; }

.illus-mock { background: linear-gradient(165deg, #fdf2f8, #fff); text-align: center; }
.illus-mock .badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  color: var(--pink-dark); background: rgba(244, 114, 182, 0.12);
  padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
}
.illus-mock .title { font-size: 17px; font-weight: 700; color: var(--pink-dark); margin-bottom: 6px; }
.illus-mock .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.illus-fake-input {
  width: 100%; padding: 12px; border: 1px solid rgba(244, 114, 182, 0.35);
  border-radius: 10px; color: #94a3b8; font-size: 14px; margin-bottom: 12px; background: #fff;
}
.illus-fake-btn {
  width: 100%; padding: 13px; border-radius: 10px;
  background: linear-gradient(135deg, var(--pink), #fb7185);
  color: #fff; font-weight: 600; font-size: 15px;
}

.illus-game {
  background: url('photo/bg_day_clear.jpg') center/cover;
  min-height: 160px; padding: 12px; border-radius: 12px;
}
.illus-game .chip {
  display: inline-block; padding: 4px 10px; margin: 0 4px 4px 0;
  background: rgba(255,255,255,0.94); border-radius: 999px;
  font-size: 11px; font-weight: 600;
}

.illus-api-block {
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #e2e8f0; background: #fff;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
}
.illus-api-block:last-of-type { margin-bottom: 0; }
.illus-api-block h4 {
  font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--pink-dark);
  padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;
}
.illus-api-block .action-steps { gap: 8px; }
.illus-api-block .action-step { padding: 12px; border-radius: 10px; }
.illus-api-block a { color: var(--pink-dark); font-weight: 600; word-break: break-all; }

.illus-timeline {
  display: flex; flex-direction: column; gap: 0;
  margin: 12px 0 4px;
  padding: 16px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
}
.illus-timeline-item {
  display: flex; align-items: flex-start; gap: 14px;
  font-size: 15px; color: #334155; line-height: 1.65;
}
.illus-timeline-item:not(:last-child) { padding-bottom: 16px; }
.illus-timeline-rail {
  flex-shrink: 0; width: 20px; display: flex; flex-direction: column; align-items: center;
  padding-top: 5px;
}
.illus-timeline-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pink); box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.22);
}
.illus-timeline-line {
  flex: 1; width: 2px; min-height: 20px;
  background: rgba(244, 114, 182, 0.22); margin-top: 6px;
}
.illus-timeline-text { flex: 1; min-width: 0; padding-top: 0; }

.faq-item {
  border: 1px solid #e2e8f0; border-radius: 12px;
  margin-bottom: 8px; overflow: hidden; background: #fff;
}
.faq-item summary {
  padding: 14px 16px; font-size: 14px; font-weight: 600;
  cursor: pointer; list-style: none;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item[open] summary { color: var(--pink-dark); background: rgba(252, 231, 243, 0.45); }
.faq-item p { padding: 0 16px 14px; font-size: 14px; color: #475569; line-height: 1.6; }

.finish-card { text-align: center; padding: 20px 8px; }
.finish-card .emoji { font-size: 44px; margin-bottom: 12px; }
.finish-card h2 { font-size: 20px; font-weight: 700; color: var(--pink-dark); margin-bottom: 10px; }
.finish-card p { font-size: 15px; color: #475569; line-height: 1.6; }

.wizard-footer {
  flex-shrink: 0; display: flex; gap: 10px;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(244, 114, 182, 0.1);
}
.wizard-btn {
  flex: 1; padding: 14px 16px; border-radius: 12px;
  font-family: inherit; font-size: 16px; font-weight: 600;
  cursor: pointer; border: none;
}
.wizard-btn:active { transform: scale(0.98); }
.wizard-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.wizard-btn-prev {
  flex: 0.7; background: #f8fafc; color: #475569;
  border: 1px solid #e2e8f0;
}
.wizard-btn-next {
  background: linear-gradient(135deg, var(--pink), #fb7185);
  color: #fff; box-shadow: 0 3px 14px rgba(190, 24, 93, 0.22);
}
</style>
</head>
<body>

<div class="wizard-shell">
  <aside class="wizard-sidebar" id="sidebar" aria-label="学习进度"></aside>
  <div class="wizard-main">
    <header class="wizard-header">
      <div class="header-top">
        <div class="header-progress" aria-hidden="true"><div class="header-progress-fill" id="header-progress-fill"></div></div>
        <span class="header-step-badge" id="header-step-badge">1 / 16</span>
      </div>
      <h1 id="slide-title">上手引导</h1>
      <p id="slide-subtitle">《心动信号·暗涌》</p>
      <div class="top-nav-wrap">
        <nav class="top-nav" id="top-nav" aria-label="板块快速导航"></nav>
      </div>
    </header>
    <div class="wizard-body" id="wizard-body"></div>
    <footer class="wizard-footer">
      <button type="button" class="wizard-btn wizard-btn-prev" id="btn-prev" disabled>上一步</button>
      <button type="button" class="wizard-btn wizard-btn-next" id="btn-next">开始上手</button>
    </footer>
  </div>
</div>

<script>
var GUIDE_CONFIG = {
  assistantDouyin: '@待补充',
  gameFileName: '恋综模拟器Pro.html',
  version: '2.2.0',
  gameTitle: '《心动信号·暗涌》'
};

var STEPS = [
  {
    id: 'welcome',
    label: '介绍',
    title: '安装与上手引导',
    subtitle: '叩君芯 · 恋综模拟器',
    nextLabel: '开始上手',
    html:
      '<div class="slide-card">' +
        '<div class="hero-card">' +

(function () {
  var current = 0;
  var sidebar = document.getElementById('sidebar');
  var body = document.getElementById('wizard-body');
  var titleEl = document.getElementById('slide-title');
  var subtitleEl = document.getElementById('slide-subtitle');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var progressFill = document.getElementById('header-progress-fill');
  var stepBadge = document.getElementById('header-step-badge');
  var topNav = document.getElementById('top-nav');

  if (GUIDE_CONFIG.assistantDouyin && GUIDE_CONFIG.assistantDouyin !== '@待补充') {
    STEPS.forEach(function (s) {
      if (s.id === 'faq') {
        s.html = s.html.replace(
          '抖音私信小助理，或翻会员群聊天记录看别人怎么解决的。',
          '抖音搜 ' + GUIDE_CONFIG.assistantDouyin + ' 私信小助理，或翻会员群聊天记录。'
        );
      }
    });
  }

  function renderSidebar() {
    sidebar.innerHTML =
      '<div class="sidebar-brand">' +
        '<span class="brand-name">KOUJUNXIN</span>' +
        '<span class="brand-game">叩君芯</span>' +
        '<span class="sidebar-progress">' + (current + 1) + ' / ' + STEPS.length + '</span>' +
      '</div>' +
      '<nav class="sidebar-nav">' +
      STEPS.map(function (step, i) {
        var cls = 'sidebar-item';
        if (i === current) cls += ' active';
        else if (i < current) cls += ' done';
        return '<button type="button" class="' + cls + '" data-idx="' + i + '">' +
          '<span class="sidebar-dot">' + (i < current ? '✓' : (i + 1)) + '</span>' +
          '<span class="sidebar-label">' + step.label + '</span></button>';
      }).join('') +
      '</nav>';

    sidebar.querySelectorAll('.sidebar-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        goTo(parseInt(btn.getAttribute('data-idx'), 10));
      });
    });
    var activeBtn = sidebar.querySelector('.sidebar-item.active');
    if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function renderTopNav() {
    if (!topNav) return;
    topNav.innerHTML = STEPS.map(function (step, i) {
      var cls = 'top-nav-chip';
      if (i === current) cls += ' active';
      else if (i < current) cls += ' done';
      return '<button type="button" class="' + cls + '" data-idx="' + i + '" aria-current="' + (i === current ? 'step' : 'false') + '">' + step.label + '</button>';
    }).join('');

    topNav.querySelectorAll('.top-nav-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        goTo(parseInt(btn.getAttribute('data-idx'), 10));
      });
    });

    var activeChip = topNav.querySelector('.top-nav-chip.active');
    if (activeChip) {
      activeChip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  }

  function renderSlide() {
    var step = STEPS[current];
    titleEl.textContent = step.title;
    subtitleEl.textContent = step.subtitle;
    body.innerHTML = '<div class="wizard-slide">' + step.html + '</div>';

    var douyinLine = document.getElementById('douyin-line');
    if (douyinLine) douyinLine.textContent = '小助理抖音：' + GUIDE_CONFIG.assistantDouyin;

    btnPrev.disabled = current === 0;
    if (progressFill) {
      progressFill.style.width = Math.round(((current + 1) / STEPS.length) * 100) + '%';
    }
    if (stepBadge) {
      stepBadge.textContent = (current + 1) + ' / ' + STEPS.length;
    }
    if (current === STEPS.length - 1) {
      btnNext.textContent = step.nextLabel || '完成';
    } else if (step.nextLabel) {
      btnNext.textContent = step.nextLabel;
    } else {
      btnNext.textContent = '下一步';
    }
    renderSidebar();
    renderTopNav();
  }

  function goTo(idx) {
    if (idx < 0 || idx >= STEPS.length) return;
    current = idx;
    renderSlide();
    body.scrollTop = 0;
  }

  btnPrev.addEventListener('click', function () { goTo(current - 1); });
  btnNext.addEventListener('click', function () {
    if (current < STEPS.length - 1) goTo(current + 1);
  });

  renderSlide();
})();
</script>
</body>
</html>
