<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%233ee0c8' width='16' height='16' rx='3'/></svg>" />
    <title>小小人</title>
  </head>
  <body>
    <div id="app" data-phase="loading">
      <canvas id="view" tabindex="0" aria-label="小小人游戏画面"></canvas>
      <div id="hud">
        <section id="screen-load" class="screen" data-testid="loading">
          <div class="load-card">
            <p class="eyebrow">第一人称 · 星空枢纽</p>
            <h1 data-testid="title">小小人</h1>
            <p>正在进入星空…</p>
            <div class="bar" data-testid="load-bar"><i id="load-bar"></i></div>
            <span id="load-pct" data-testid="load-pct">0%</span>
          </div>
        </section>

        <section id="screen-play" class="screen overlay" data-testid="screen-play" hidden>
          <div class="top-bar">
            <span id="play-status">星空枢纽</span>
            <span class="hint">左摇杆移动 · 拖动画面转向 · 右下角钩爪</span>
          </div>
          <div class="crosshair" data-testid="crosshair"></div>
          <aside id="identify-card" class="card" data-testid="identify-card" hidden></aside>
          <div class="float-label" data-testid="level-label">第一关 · 我的手机</div>
          <div class="float-label muted" data-testid="level-2-label">第二关 · 我的电脑</div>
          <div class="float-label muted" data-testid="level-3-label">第三关 · 无线耳机</div>
          <div class="play-actions">
            <div class="hook-orb" data-testid="hook-orb">
              <div class="half-left">
                <button type="button" data-testid="btn-identify">鉴定</button>
              </div>
              <div class="half-right">
                <button type="button" class="primary" data-testid="btn-fire">发射</button>
              </div>
            </div>
            <div class="act-stack">
              <button type="button" data-testid="btn-home">返回</button>
              <button type="button" data-testid="btn-explode-fps" hidden>爆炸</button>
              <button type="button" data-testid="btn-enter" hidden>进入</button>
              <button type="button" data-testid="btn-dismount" hidden>离开</button>
            </div>
          </div>
          <div id="joystick" class="joystick" data-testid="joystick" hidden>
            <div class="joy-base"><div id="joy-knob" class="joy-knob"></div></div>
          </div>
        </section>

        <div id="toast" data-testid="toast" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
