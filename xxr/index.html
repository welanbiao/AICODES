<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0d12" />
    <style>
      html,body,#app{background:#0b0d12;margin:0;width:100%;height:100%;position:relative;color:#f3efe6;font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;}
      #screen-load{
        position:absolute;inset:0;z-index:40;
        display:flex;align-items:center;justify-content:center;
        background:#0b0d12;pointer-events:auto;
      }
      #screen-load .load-card{
        width:min(420px,calc(100% - 40px));
        padding:28px 24px;
        text-align:center;
        border:1px solid rgba(255,255,255,.12);
        background:rgba(12,14,20,.88);
        border-radius:18px;
      }
      #screen-load .eyebrow{margin:0 0 6px;letter-spacing:.18em;color:#3ee0c8;font-size:11px;}
      #screen-load h1{margin:0 0 12px;font-size:36px;font-weight:650;letter-spacing:.08em;}
      #screen-load .load-msg{margin:0;color:#b7b1a4;font-size:15px;}
      #screen-load .bar{margin:18px auto 8px;height:6px;max-width:260px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
      #screen-load .bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#e39b6c,#3ee0c8);}
      #screen-load #load-pct{color:#b7b1a4;font-size:13px;}
      #screen-load[hidden],#screen-play[hidden],#screen-about[hidden]{display:none!important;}
      #view{position:absolute;inset:0;width:100%;height:100%;display:block;}
      #hud{position:absolute;inset:0;pointer-events:none;}
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%233ee0c8' width='16' height='16' rx='3'/></svg>" />
    <title>小小人</title>
  </head>
  <body>
    <div id="app" data-phase="loading">
      <section id="screen-load" class="screen" data-testid="loading">
        <div class="load-card">
          <p class="eyebrow">第一人称 · 小小人</p>
          <h1 data-testid="title">小小人</h1>
          <p class="load-msg">正在进入星空…</p>
          <div class="bar" data-testid="load-bar"><i id="load-bar"></i></div>
          <span id="load-pct" data-testid="load-pct">0%</span>
        </div>
      </section>
      <canvas id="view" tabindex="0" aria-label="小小人游戏画面"></canvas>
      <div id="hud">
        <section id="screen-play" class="screen overlay" data-testid="screen-play" hidden>
          <div class="top-bar">
            <span id="play-status">小小人</span>
            <button type="button" class="about-btn" data-testid="btn-about">?</button>
          </div>
          <div class="crosshair" data-testid="crosshair"></div>
          <aside id="identify-card" class="card" data-testid="identify-card" hidden></aside>
          <div class="float-label" data-testid="level-label">手机</div>
          <div class="float-label muted" data-testid="level-2-label">20世纪电脑</div>
          <div class="float-label muted" data-testid="level-3-label">21世纪电脑</div>
          <div class="float-label muted" data-testid="level-4-label">康纳</div>
          <div class="float-label muted" data-testid="level-5-label">诺斯</div>
          <div class="play-actions">
            <div class="hook-orb" data-testid="hook-orb">
              <div class="half-left">
                <button type="button" data-testid="btn-identify">鉴定</button>
              </div>
              <div class="half-right">
                <button type="button" class="primary" data-testid="btn-fire">发射</button>
              </div>
            </div>
            <div class="act-stack">
              <button type="button" data-testid="btn-home">返回</button>
              <button type="button" data-testid="btn-explode-fps" hidden>动作</button>
              <button type="button" data-testid="btn-enter" hidden>进入</button>
              <button type="button" data-testid="btn-dismount" hidden>离开</button>
            </div>
          </div>
          <div id="joystick" class="joystick" data-testid="joystick" hidden>
            <div class="joy-base"><div id="joy-knob" class="joy-knob"></div></div>
          </div>
        </section>

        <div id="toast" data-testid="toast" hidden></div>
      </div>
      <section id="screen-about" class="screen" data-testid="about" hidden>
        <div class="load-card about-card">
          <p class="eyebrow">关于</p>
          <h1 id="about-title">小小人</h1>
          <div id="about-body" class="about-body" data-testid="about-body"></div>
          <button type="button" class="about-close" data-testid="btn-about-close">关闭</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
