<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0a0610; touch-action: none;
      }
      #unity-container {
        position: fixed; left: 0; top: 0;
        width: 100%; height: 100%;
        background: #0a0610;
      }
      #unity-canvas {
        display: block; width: 100%; height: 100%;
        background: {{{ BACKGROUND_COLOR }}};
      }
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        color: #f2d48a; font-family: sans-serif; text-align: center;
      }
      #unity-progress-bar-empty {
        width: 180px; height: 10px; margin-top: 12px;
        background: #3a2412; border-radius: 6px; overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%; height: 100%; background: #e48a2a;
      }
      #unity-warning { position: absolute; left: 50%; top: 8%; transform: translate(-50%); display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="720" height="1280" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>大闹西游路</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") div.style = "background: red; padding: 10px; color: #fff;";
        else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function fitPhone() {
        var w = window.innerWidth || document.documentElement.clientWidth;
        var h = window.innerHeight || document.documentElement.clientHeight;
        var rw = Math.min(w, h * 9 / 16);
        var rh = Math.min(h, w * 16 / 9);
        container.style.left = ((w - rw) * 0.5) + "px";
        container.style.top = ((h - rh) * 0.5) + "px";
        container.style.width = rw + "px";
        container.style.height = rh + "px";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      window.addEventListener("resize", fitPhone);
      window.addEventListener("orientationchange", fitPhone);
      fitPhone();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function () {
          loadingBar.style.display = "none";
          fitPhone();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
